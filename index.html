<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meen & Summer's Pocket Story</title>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Mitr', sans-serif; text-transform: lowercase; font-weight: 300; }
        
        /* 🌈 Background Theme */
        body {
            background-color: #fff9f5;
            background-image: radial-gradient(#ffe4e1 18%, transparent 19%);
            background-size: 26px 26px;
            color: #5c4b37;
            margin: 0;
            padding: 24px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-card {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            border-radius: 40px;
            box-shadow: 0 20px 45px rgba(255, 175, 204, 0.25);
            border: 4px solid #ffe5ec;
            overflow: hidden;
            position: relative;
        }

        /* Top Bar */
        .top-bar {
            background-color: #dcf5e7;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #b7e4c7;
        }
        .app-title { font-size: 1.15rem; font-weight: 400; color: #407a52; margin: 0; }
        
        /* EXP Bar & Level */
        .exp-zone {
            background: #fffdf0;
            padding: 10px 24px;
            display: flex; align-items: center; gap: 12px;
            font-size: 0.8rem; color: #d97724;
        }
        .exp-bar-outer {
            flex: 1; height: 12px; background: #ffeedb;
            border-radius: 10px; overflow: hidden; border: 1px solid #ffd6a5;
        }
        .exp-bar-inner {
            height: 100%; width: 30%;
            background: linear-gradient(90deg, #ffea00, #ff9e00);
            border-radius: 10px;
        }

        /* Nav Grid */
        .nav-grid {
            display: flex; background: #fffdf0; padding: 10px;
            gap: 8px; border-bottom: 3px solid #ffea99;
        }
        .nav-item {
            flex: 1; text-align: center; padding: 10px 4px;
            font-size: 0.82rem; color: #9c846f; cursor: pointer;
            border-radius: 18px; background: #fff; border: 2px solid #ffe5ec;
        }
        .nav-item.active {
            color: #fff; background: #ffafcc; border-color: #ff85a1; box-shadow: 0 4px 0 #e65c7b;
        }

        /* Screen Views */
        .view-screen { display: none; padding: 24px; }
        .view-screen.active { display: block; }

        /* Pocket Selector */
        .pocket-row { display: flex; gap: 10px; margin-bottom: 20px; }
        .pocket-btn {
            flex: 1; padding: 11px 6px; background: #fff; border: 2px solid #eee0d3;
            border-radius: 20px; font-size: 0.82rem; color: #8c7158; cursor: pointer;
            text-align: center; box-shadow: 0 3px 0 #eee0d3;
        }
        #p-min { background: #a2d2ff; border-color: #8ebcf0; color: #fff; box-shadow: 0 4px 0 #6c9cd4; }
        
        /* แก้ไขสีแท็บออมเงินตามที่น้องรีเควส */
        #p-katsu { background: #ffc375; border-color: #e5ab5c; color: #fff; box-shadow: 0 4px 0 #cc9345; }

        /* Input Form */
        .form-group { display: flex; flex-direction: column; gap: 16px; }
        .amount-field {
            font-size: 2.4rem; text-align: right; color: #fb8500;
            background: #fffefb; border: 3px solid #ffe5ec; border-radius: 24px;
            padding: 12px 20px; outline: none; box-shadow: inset 0 3px 6px rgba(0,0,0,0.03);
        }
        .input-field {
            padding: 13px 18px; border: 2px solid #ffe5ec; border-radius: 18px;
            outline: none; font-size: 0.92rem; background: #fffefb; color: #6b533e;
        }

        /* แก้ไขสีปุ่ม Stamp เป็นสีเขียว #bff075 */
        .stamp-btn {
            background: #bff075;
            color: #3b6327;
            border: 2px solid #a3d957;
            padding: 15px;
            border-radius: 24px;
            font-size: 1.18rem;
            cursor: pointer;
            box-shadow: 0 5px 0 #8bbf43;
            transition: 0.1s;
            margin-top: 6px;
        }
        .stamp-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #8bbf43; }

        /* 📝 Daily Quest Styles (ไม่มีอิโมจิ) */
        .quest-list { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        .quest-item {
            background: #fff; border: 2px solid #ffe5ec; border-radius: 16px;
            padding: 16px; display: flex; justify-content: space-between; align-items: center;
        }
        .quest-info { flex: 1; }
        .quest-title { font-size: 0.95rem; color: #5c4b37; margin-bottom: 4px; }
        .quest-progress { font-size: 0.8rem; color: #9c846f; }
        
        .claim-btn { padding: 8px 18px; border-radius: 14px; font-size: 0.85rem; border: none; font-weight: 400; }
        .claim-btn.ready { background: #bff075; color: #3b6327; box-shadow: 0 4px 0 #8bbf43; cursor: pointer; }
        .claim-btn.ready:active { transform: translateY(3px); box-shadow: 0 1px 0 #8bbf43; }
        .claim-btn.locked { background: #f2f2f2; color: #b3b3b3; box-shadow: 0 4px 0 #d9d9d9; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="game-card">
    <!-- Top Bar -->
    <div class="top-bar">
        <h1 class="app-title">pocket story</h1>
        <div class="bgm-btn">♫ bgm</div>
    </div>

    <!-- EXP Zone -->
    <div class="exp-zone">
        <span>lv.5</span>
        <div class="exp-bar-outer"><div class="exp-bar-inner"></div></div>
    </div>

    <!-- Navigation -->
    <div class="nav-grid">
        <div class="nav-item active" onclick="switchTab('fast-entry')">fast entry</div>
        <div class="nav-item" onclick="switchTab('quest-view')">daily quest</div>
    </div>

    <!-- 1. หน้า Fast Entry -->
    <div id="fast-entry" class="view-screen active">
        <!-- ลบอิโมจิตรงออมเงินแล้วจ้า -->
        <div class="pocket-row">
            <button class="pocket-btn" id="p-min">กระเป๋ามีน</button>
            <button class="pocket-btn">กระเป๋าซัมเมอร์</button>
            <button class="pocket-btn" id="p-katsu">ออมเงิน</button> 
        </div>

        <div class="form-group">
            <input type="text" class="amount-field" value="0.00" readonly>
            <input type="text" class="input-field" placeholder="หมวดหมู่ (เช่น กิน, พะโล้)">
            <input type="text" class="input-field" placeholder="รายละเอียดเพิ่มเติม">
            <button class="stamp-btn">stamp!</button>
        </div>
    </div>

    <!-- 2. หน้า Daily Quest -->
    <div id="quest-view" class="view-screen">
        <h3 style="color: #407a52; text-align: center; margin: 0 0 15px 0;">daily quest</h3>
        
        <div class="quest-list">
            <div class="quest-item">
                <div class="quest-info">
                    <div class="quest-title">จดรายรับรายจ่ายครั้งแรกของวัน</div>
                    <div class="quest-progress">1 / 1</div>
                </div>
                <button class="claim-btn ready">claim!</button>
            </div>

            <div class="quest-item">
                <div class="quest-info">
                    <div class="quest-title">บันทึกรายจ่ายหมวดอาหาร 3 ครั้ง</div>
                    <div class="quest-progress">1 / 3</div>
                </div>
                <button class="claim-btn locked" disabled>locked</button>
            </div>

            <div class="quest-item">
                <div class="quest-info">
                    <div class="quest-title">ออมเงินเข้ากระปุกหมู 50 บาท</div>
                    <div class="quest-progress">0 / 50</div>
                </div>
                <button class="claim-btn locked" disabled>locked</button>
            </div>
            
            <div class="quest-item">
                <div class="quest-info">
                    <div class="quest-title">จดบันทึกติดต่อกัน 3 วัน</div>
                    <div class="quest-progress">2 / 3</div>
                </div>
                <button class="claim-btn locked" disabled>locked</button>
            </div>
        </div>
    </div>
</div>

<script>
    // สคริปต์เล็กๆ จากพี่สาว เอาไว้ให้กดสลับหน้าดูพรีวิวได้จ้ะ
    function switchTab(tabId) {
        document.querySelectorAll('.view-screen').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        event.target.classList.add('active');
    }
</script>

</body>
</html>
